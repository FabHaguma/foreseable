name: forseen
services:
  backend_forseen:
    image: backend_forseen:${RELEASE_TAG:-1.0.0}
    build:
      context: ./call_4_feedback
      dockerfile: Dockerfile
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env to a private password of at least 12 characters}
      INITIAL_DATA_KEY: ${INITIAL_DATA_KEY:-}
      INITIAL_DATA_FILE: /bootstrap/initial-contacts.enc
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3010
      DATA_DIR: /data
    volumes:
      - forseen_data:/data
      - ./private-data:/bootstrap:ro
    networks:
      - internal_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
  frontend_forseen:
    image: frontend_forseen:${RELEASE_TAG:-1.0.0}
    build:
      context: ./call_4_feedback
      dockerfile: Dockerfile.frontend
    depends_on:
      backend_forseen:
        condition: service_healthy
    networks:
      - internal_net
      - caddy_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
networks:
  internal_net: {}
  caddy_network:
    external: true
volumes:
  forseen_data: {}
